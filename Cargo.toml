[workspace]
members = [
    "caelix-api",
    "caelix-llm",
    "caelix-tools",
    "caelix-message",
    "caelix-task",
    "caelix-runtime",
    "caelix-agent",
    "caelix-config",
    "caelix-service",
    "caelix-cli",
    "caelix-http",
    "caelix-tui",
    "caelix-bin",
    "caelix-security",
]
resolver = "2"

[workspace.dependencies]
# 共享依赖版本管理
async-trait = "0.1.80"
tokio = { version = "1.38.0", features = ["full"] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_yaml = "0.9"
uuid = { version = "1.8.0", features = ["v4","serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "1.0.61"
dirs = "5.0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }
walkdir = "2.5.0"
anyhow = "1.0.102"
futures = "0.3.32"
cron = "0.16.0"
dashmap = "6.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = { version = "0.8.9" }
tower = { version = "0.5.3" }
tower-http = { version = "0.6", features = ["cors"] }
ratatui = { version = "0.30.0" }
crossterm = { version = "0.29.0" }
rust-embed = "8.11.0"
snowflaked = "1.0.3"
once_cell = "1.19.0"
clap = { version = "4.0", features = ["derive"] }
bitflags = "2.6.0"
async-stream = "0.3"
inventory = "0.3"
