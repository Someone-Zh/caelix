[package]
name = "caelix-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.80"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_yaml = "0.9"
tokio = { version = "1.38.0", features = ["full"] }
chrono = { version = "0.4.38", features = ["serde", "std"] }
walkdir = "2.5.0"
anyhow = "1.0.102"
tracing = "0.1.44"
parking_lot = "0.12.1"
dashmap = "6.1.0"
dirs = "5.0.1"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
regex = "1.10.5"

caelix-api = { path = "../caelix-api" }
caelix-task = { path = "../caelix-task" }
caelix-config = { path = "../caelix-config" }
caelix-message = { path = "../caelix-message" }