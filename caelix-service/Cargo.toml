[package]
name = "caelix-service"
version = "0.1.0"
edition = "2024"

[dependencies]
caelix-api = { path = "../caelix-api" }
caelix-config = { path = "../caelix-config" }
caelix-security = { path = "../caelix-security" }
caelix-runtime = { path = "../caelix-runtime" }
caelix-task = { path = "../caelix-task" }
caelix-message = { path = "../caelix-message" }
caelix-agent = { path = "../caelix-agent" }
caelix-tools = { path = "../caelix-tools" }
caelix-llm = { path = "../caelix-llm" }
caelix-memory = { path = "../caelix-memory" }
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
inventory.workspace = true
regex = "1.10"

[features]
default = []
ast = ["caelix-tools/ast"]
ast-rust = ["caelix-tools/ast-rust"]
ast-python = ["caelix-tools/ast-python"]
ast-ts = ["caelix-tools/ast-ts"]
ast-go = ["caelix-tools/ast-go"]
ast-c = ["caelix-tools/ast-c"]
