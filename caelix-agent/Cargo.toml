version = "0.1.0"
edition = "2024"

[features]
default = []
logging = ["tracing-subscriber"]

[dependencies]
caelix-api = { path = "../caelix-api" }
caelix-llm = { path = "../caelix-llm" }
caelix-tools = { path = "../caelix-tools" }
caelix-runtime = { path = "../caelix-runtime" }
